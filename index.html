<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ciência Quest — Pequenos Cientistas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="brandIcon">🔬</div><div><b>Ciência Quest</b><small>Pequenos Cientistas</small></div></div>
  <div class="score">⭐ <b id="score">0</b></div>
</header>

<section id="home" class="screen active">
  <div class="hero">
    <div class="characters"><span>🧑‍🔬</span><span>🐾</span><span>🌱</span><span>🤖</span></div>
    <span class="tag">LABORATÓRIO DE DESCOBERTAS</span>
    <h1>Vamos descobrir a Ciência?</h1>
    <p>Escolha sua turma e complete pequenas missões científicas.</p>
    <div class="gradeGrid">
      <button data-grade="pre1"><span>🌈</span><div><b>Pré I</b><small>Descobrir e observar</small></div><strong>›</strong></button>
      <button data-grade="pre2"><span>🚀</span><div><b>Pré II</b><small>Explorar e classificar</small></div><strong>›</strong></button>
      <button data-grade="1"><span>🌱</span><div><b>1º ano</b><small>Seres vivos e ambiente</small></div><strong>›</strong></button>
      <button data-grade="2"><span>💧</span><div><b>2º ano</b><small>Corpo, plantas e natureza</small></div><strong>›</strong></button>
      <button data-grade="3"><span>🫀</span><div><b>3º ano</b><small>Corpo, Terra e animais</small></div><strong>›</strong></button>
      <button data-grade="4"><span>🌎</span><div><b>4º ano</b><small>Ecossistemas e matéria</small></div><strong>›</strong></button>
      <button data-grade="5"><span>🧬</span><div><b>5º ano</b><small>Ciência e investigação</small></div><strong>›</strong></button>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <div class="gamebar">
    <button id="homeBtn" class="icon" aria-label="Voltar">⌂</button>
    <div class="stage"><b id="gradeName"></b><small id="roundName"></small></div>
    <div class="timer" id="timer"></div><div class="lives" id="lives">❤️❤️❤️</div>
  </div>
  <div class="progress"><i id="progress"></i></div>
  <div class="mission"><span id="missionIcon">🔎</span><div><small>MISSÃO</small><b id="instruction"></b></div></div>
  <div class="board">
    <section class="panel"><div class="panelTitle"><b id="leftTitle">Figuras</b><small>Arraste ou toque</small></div><div id="items"></div></section>
    <section class="panel"><div class="panelTitle"><b id="rightTitle">Onde vai?</b><small>Complete a missão</small></div><div id="targets"></div></section>
  </div>
  <div id="message" class="message" aria-live="polite"></div>
  <button id="next" class="next" hidden>Continuar missão →</button>
</section>

<section id="result" class="screen">
 <div class="resultCard">
  <div class="confetti">🎉</div><div class="medal">🏆</div><span class="tag">MISSÃO CONCLUÍDA</span>
  <h1>Excelente trabalho!</h1><p id="resultText"></p>
  <div class="stats"><div>⭐<b id="finalScore">0</b><small>pontos</small></div><div>🔬<b id="finalHits">0</b><small>descobertas</small></div></div>
  <button id="again">🔄 Escolher outra turma</button>
 </div>
</section>
</div>
<script src="script.js"></script>
</body></html>
